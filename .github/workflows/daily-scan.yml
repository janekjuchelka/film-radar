name: Daily Film Radar scan

on:
  schedule:
    # GitHub cron často zpozdí o hodiny — 2 pokusy denně
    # ~7:00 SEČ / CEST
    - cron: "0 5 * * *"
    # ~13:00 SEČ / CEST (záloha, kdyby ranní běh nestihl)
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run daily scan
        run: npm run scan
        env:
          SCAN_PER_PROVIDER: "30"
          CSFD_DELAY_MS: "1500"
          MIN_CSFD_RATING: "70"

      - name: Commit feed + DB
        run: |
          cd ..
          git config user.name "film-radar-bot"
          git config user.email "film-radar-bot@users.noreply.github.com"
          git add feed/titles.json server/data/db.json || true
          if git diff --staged --quiet; then
            echo "No feed changes"
          else
            git commit -m "chore: daily film radar feed update"
            git push
          fi
