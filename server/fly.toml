# fly.toml app name will be set by `fly launch`
app = "film-radar-cz"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  API_HOST = "0.0.0.0"
  SCAN_CRON = "0 6 * * *"
  MIN_CSFD_RATING = "60"
  SCAN_ON_START = "true"
  SCAN_PER_PROVIDER = "30"
  CSFD_DELAY_MS = "1500"

[http_service]
  internal_port = 3847
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "2m"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
