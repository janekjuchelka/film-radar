<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12141A" />
  <title>Film Radar</title>
  <style>
    :root {
      --bg: #12141a;
      --text: #f4f1ea;
      --muted: #9aa0ae;
      --line: #2a2f3a;
      --accent: #e8c468;
      --card: #1a1e27;
      --err: #e07a6a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1c2230, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 28px 18px 12px;
    }
    h1 {
      margin: 0;
      font-size: 2.1rem;
      letter-spacing: -0.03em;
    }
    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 18px 16px;
    }
    .chip {
      border: 1px solid var(--line);
      background: var(--card);
      color: #b7bcc8;
      padding: 8px 12px;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .chip.active {
      border-color: var(--accent);
      color: var(--accent);
      background: #2a2416;
    }
    .status {
      padding: 8px 18px 16px;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
    }
    .status.error { color: var(--err); white-space: pre-wrap; }
    .list { padding: 0 18px 40px; }
    .row {
      display: flex;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: inherit;
    }
    .poster {
      width: 72px;
      height: 108px;
      object-fit: cover;
      background: var(--card);
      flex-shrink: 0;
    }
    .meta { min-width: 0; }
    .title {
      font-size: 1.15rem;
      margin: 0 0 4px;
      line-height: 1.25;
    }
    .year {
      margin: 0;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
    }
    .rating {
      margin: 8px 0 0;
      color: var(--accent);
      font-family: system-ui, sans-serif;
      font-weight: 700;
      font-size: 1rem;
    }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .badge {
      background: #252a35;
      color: #c5cad6;
      padding: 3px 8px;
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 18px;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <header>
    <h1>Film Radar</h1>
    <p class="sub">Novinky ≥ 70 % na ČSFD</p>
  </header>

  <div class="chips" id="chips">
    <button class="chip active" data-type="all">Vše</button>
    <button class="chip" data-type="movie">Filmy</button>
    <button class="chip" data-type="series">Seriály</button>
    <button class="chip" data-provider="netflix">Netflix</button>
    <button class="chip" data-provider="disney">Disney+</button>
    <button class="chip" data-provider="oneplay">Oneplay</button>
  </div>

  <div class="status" id="status">Načítám…</div>
  <div class="list" id="list"></div>

  <script>
    const labels = { netflix: "Netflix", disney: "Disney+", oneplay: "Oneplay" };
    let type = "all";
    let provider = "all";

    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");

    document.getElementById("chips").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      if (btn.dataset.type) {
        type = btn.dataset.type;
        document.querySelectorAll("[data-type]").forEach((b) => b.classList.toggle("active", b === btn));
      }
      if (btn.dataset.provider) {
        provider = provider === btn.dataset.provider ? "all" : btn.dataset.provider;
        document.querySelectorAll("[data-provider]").forEach((b) => {
          b.classList.toggle("active", b.dataset.provider === provider);
        });
      }
      load();
    });

    async function load() {
      statusEl.className = "status";
      statusEl.textContent = "Načítám…";
      listEl.innerHTML = "";
      try {
        const params = new URLSearchParams({ minRating: "70" });
        if (type !== "all") params.set("type", type);
        if (provider !== "all") params.set("provider", provider);
        const res = await fetch("/titles?" + params.toString());
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const titles = data.titles || [];
        statusEl.textContent = titles.length + " titulů";
        if (!titles.length) {
          listEl.innerHTML = '<p class="empty">Zatím nic. Spusť scan na serveru.</p>';
          return;
        }
        listEl.innerHTML = titles.map((t) => {
          const href = t.csfdUrl || "#";
          const poster = t.posterUrl
            ? '<img class="poster" src="' + t.posterUrl + '" alt="" />'
            : '<div class="poster"></div>';
          const badges = (t.providers || []).map((p) =>
            '<span class="badge">' + (labels[p] || p) + "</span>"
          ).join("");
          return (
            '<a class="row" href="' + href + '" target="_blank" rel="noopener">' +
              poster +
              '<div class="meta">' +
                '<p class="title">' + escapeHtml(t.title) + "</p>" +
                '<p class="year">' + (t.year || "—") + " · " + (t.type === "series" ? "Seriál" : "Film") + "</p>" +
                '<p class="rating">' + t.csfdRating + " % ČSFD</p>" +
                '<div class="badges">' + badges + "</div>" +
              "</div>" +
            "</a>"
          );
        }).join("");
      } catch (err) {
        statusEl.className = "status error";
        statusEl.textContent = "Chyba: " + (err && err.message ? err.message : String(err));
      }
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    load();
  </script>
</body>
</html>
